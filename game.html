<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小游戏</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            /* 禁止移动端弹性滚动 */
            overscroll-behavior: none;
        }

        .game-page-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 80px 20px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 200;
        }

        .game-page-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .game-page-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .game-page-desc {
            color: var(--text-muted);
            font-size: 14px;
        }

        .game-play-area {
            width: 100%;
            max-width: 760px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.12);
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body.dark-theme .game-play-area {
            background: rgba(30, 35, 50, 0.6);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .game-info-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .game-score, .game-highscore {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-color);
            background: rgba(255,255,255,0.4);
            padding: 5px 14px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
        }

        body.dark-theme .game-score,
        body.dark-theme .game-highscore {
            background: rgba(255,255,255,0.07);
            color: #e2e8f0;
        }

        .game-canvas-wrap {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 12px;
        }

        .game-canvas-wrap canvas {
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
            display: block;
            max-width: 100%;
            height: auto;
        }

        .game-iframe-area {
            display: none;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            margin-bottom: 12px;
            border: 1px solid var(--glass-border);
        }

        .game-iframe-area iframe {
            width: 100%;
            height: 600px;
            border: none;
            display: block;
        }

        .iframe-fallback {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 600px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            color: #fff;
            text-align: center;
            gap: 16px;
            padding: 20px;
        }

        .iframe-fallback a {
            display: inline-block;
            padding: 12px 32px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .iframe-fallback a:hover {
            background: rgba(255,255,255,0.35);
        }

        .game-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 8px;
        }

        .game-btn {
            padding: 10px 20px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.55);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
            transition: all 0.2s;
            backdrop-filter: blur(12px);
            /* 禁止选中文本 */
            user-select: none;
            -webkit-user-select: none;
        }

        .game-btn:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .game-btn.primary-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
        }

        .game-fullscreen-btn {
            font-size: 13px;
            padding: 8px 18px;
            background: linear-gradient(135deg, #667eea, #764ba2) !important;
            color: #fff !important;
            border: none !important;
        }

        .game-instructions {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 4px;
        }

        /* ===== 手机端触屏控制按钮 ===== */
        .touch-controls {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .touch-row {
            display: flex;
            gap: 8px;
        }

        .touch-btn {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: background 0.1s;
        }

        .touch-btn:active {
            background: rgba(102, 126, 234, 0.3);
            transform: scale(0.92);
        }

        body.dark-theme .touch-btn {
            background: rgba(255, 255, 255, 0.1);
        }

        .game-footer-hint {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* ===== 手机端适配 ===== */
        @media (max-width: 768px) {
            .game-page-container {
                padding: 72px 12px 24px;
            }

            .game-back-btn {
                top: 14px;
                left: 14px;
                padding: 6px 14px;
                font-size: 13px;
            }

            .game-page-title {
                font-size: 22px;
            }

            .game-page-desc {
                font-size: 12px;
            }

            .game-play-area {
                padding: 16px 12px;
                border-radius: 18px;
            }

            .game-score, .game-highscore {
                font-size: 12px;
                padding: 4px 10px;
            }

            /* iframe 游戏放大 */
            .game-iframe-area iframe {
                height: 75vh;
                max-height: 700px;
            }

            .iframe-fallback {
                height: 75vh;
                max-height: 700px;
            }

            /* 显示触屏按钮 */
            .touch-controls {
                display: flex;
            }

            /* 隐藏桌面端说明文字 */
            .game-instructions.desktop-only {
                display: none;
            }

            .game-footer-hint {
                display: block;
            }
        }

        @media (min-width: 769px) {
            .touch-controls {
                display: none !important;
            }
            .game-footer-hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <button class="glass-btn game-back-btn" onclick="goBack()">← 返回</button>

    <div class="game-page-container">
        <div class="game-page-header">
            <h1 class="game-page-title" id="gameTitle">小游戏</h1>
            <p class="game-page-desc" id="gameDesc">选择一个游戏开始玩吧</p>
        </div>

        <div class="game-play-area">
            <div class="game-info-bar">
                <div class="game-score" id="gameScore">分数: 0</div>
                <div class="game-highscore" id="gameHighScore">最高分: --</div>
            </div>

            <div class="game-canvas-wrap" id="gameCanvasArea">
                <canvas id="gameCanvas"></canvas>
            </div>

            <div class="game-iframe-area" id="gameIframeArea">
                <iframe id="gameIframe" src="" scrolling="no" loading="lazy"></iframe>
                <div class="iframe-fallback" id="iframeFallback">
                    <div style="font-size: 48px;">🎮</div>
                    <div style="font-size: 18px; font-weight: bold;">页面加载失败</div>
                    <div style="font-size: 13px; opacity: 0.8;">点击下方按钮直接访问游戏</div>
                    <a href="#" target="_blank" rel="noopener noreferrer" id="fallbackLink">直接访问游戏</a>
                </div>
            </div>

            <div class="game-controls">
                <button class="game-btn primary-btn" id="gameStartBtn" onclick="startGame()">开始游戏</button>
                <button class="game-btn" id="gamePauseBtn" onclick="togglePause()">暂停</button>
                <button class="game-btn game-fullscreen-btn" id="fullscreenBtn" onclick="openGameWeb()" style="display:none;">打开游戏</button>
            </div>

            <!-- 手机端触屏按钮 -->
            <div class="touch-controls" id="touchControls">
                <div class="touch-row">
                    <button class="touch-btn" ontouchstart="touchDir('up')" onclick="touchDir('up')">▲</button>
                </div>
                <div class="touch-row">
                    <button class="touch-btn" ontouchstart="touchDir('left')" onclick="touchDir('left')">◀</button>
                    <button class="touch-btn" ontouchstart="touchDir('down')" onclick="touchDir('down')">▼</button>
                    <button class="touch-btn" ontouchstart="touchDir('right')" onclick="touchDir('right')">▶</button>
                </div>
                <div class="touch-row" id="touchExtraRow">
                    <button class="touch-btn" id="touchActionBtn" ontouchstart="touchAction()" onclick="touchAction()" style="width:120px;font-size:14px;display:none;">↻ 旋转/硬降</button>
                </div>
            </div>

            <p class="game-instructions desktop-only" id="gameInstr"></p>
            <p class="game-footer-hint" id="touchHint" style="display:none;">使用屏幕按钮控制游戏</p>
        </div>
    </div>

    <script src="games.js"></script>
    <script src="game-main.js"></script>
</body>
</html>
